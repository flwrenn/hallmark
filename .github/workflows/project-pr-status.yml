name: PR status

on:
  pull_request:
    types: [opened]

jobs:
  set-pr-status:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: .github/scripts

      - name: Set PR to PR Open
        if: env.PROJECT_TOKEN != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ env.PROJECT_TOKEN }}
          script: |
            const { findProjectItem, setFieldValue, STATUS_FIELD_ID, PR_OPEN_OPTION_ID } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/project.js`);
            const pr = context.payload.pull_request;
            const attempts = 5;
            try {
              const item = await findProjectItem(github, pr.node_id, { attempts });
              if (!item) {
                core.warning(`PR #${pr.number} not in project after ${attempts} attempts. Verify project automation and token permissions.`);
                return;
              }
              await setFieldValue(github, item.id, STATUS_FIELD_ID, {
                singleSelectOptionId: PR_OPEN_OPTION_ID,
              });
              console.log(`PR #${pr.number} -> PR Open`);
            } catch (error) {
              core.warning(`Failed to set PR #${pr.number} to PR Open: ${error.message}`);
            }
