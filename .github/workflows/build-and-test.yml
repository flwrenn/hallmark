name: Build and test

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - run: cmake -B build/tests tests/
      - run: cmake --build build/tests
      - run: ctest --test-dir build/tests --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Pinned so CI and a local clang-format of the same version agree byte for byte.
      - run: pipx install clang-format==23.1.5

      - run: git ls-files -z '*.c' '*.h' | xargs -0 clang-format --dry-run --Werror

  firmware:
    name: Firmware build
    runs-on: ubuntu-24.04
    container: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.2.1
    env:
      NCS_VERSION: v3.2.1
      ZEPHYR_SDK_VERSION: 0.17.4
      NCS_DIR: /ncs
      ZEPHYR_BASE: /ncs/zephyr
      # The image bundles Zephyr SDK 0.17.0; Zephyr ncs-v3.2.1 asks for 0.17.4.
      ZEPHYR_SDK_DIR: /ncs/zephyr-sdk-0.17.4
    defaults:
      run:
        # The image loads the toolchain environment only in bash.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Restore west workspace and Zephyr SDK
        id: ncs-cache
        uses: actions/cache/restore@v4
        with:
          path: /ncs
          key: ncs-${{ env.NCS_VERSION }}-sdk-${{ env.ZEPHYR_SDK_VERSION }}-v2

      - name: Fetch west workspace
        if: steps.ncs-cache.outputs.cache-hit != 'true'
        run: |
          west init -m https://github.com/nrfconnect/sdk-nrf --mr "$NCS_VERSION" "$NCS_DIR"
          cd "$NCS_DIR"
          west update --narrow -o=--depth=1

      - name: Fetch Zephyr SDK (ARM toolchain only)
        if: steps.ncs-cache.outputs.cache-hit != 'true'
        working-directory: /tmp
        run: |
          base="https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v$ZEPHYR_SDK_VERSION"
          minimal="zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz"
          arm="toolchain_linux-x86_64_arm-zephyr-eabi.tar.xz"
          wget -q "$base/$minimal" "$base/$arm"
          printf '%s  %s\n' \
            a7258bf50c892c4669712b2aacdfcd5e303245bcf36cb458a296039a664594f5 "$minimal" \
            1b61084fe12076a3639aa2d028b5258f41eb3d0f7d46a16264949e1d213f1915 "$arm" \
            | sha256sum --check --strict
          apt-get update -qq && apt-get install -y -qq xz-utils
          tar -xf "$minimal" -C "$NCS_DIR"
          tar -xf "$arm" -C "$ZEPHYR_SDK_DIR"

      - name: Check Zephyr SDK version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory '/ncs/*'
          west --version
          required=$(cat "$ZEPHYR_BASE/SDK_VERSION")
          installed=$(cat "$ZEPHYR_SDK_DIR/sdk_version")
          echo "Zephyr SDK required by Zephyr: $required, installed: $installed"
          test "$installed" = "$required"

      - name: Save west workspace and Zephyr SDK
        if: steps.ncs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /ncs
          key: ${{ steps.ncs-cache.outputs.cache-primary-key }}

      - name: Build supermini_nrf52840/nrf52840/uf2
        working-directory: /ncs
        run: >-
          west build -p always -d "$GITHUB_WORKSPACE/build/uf2"
          -b supermini_nrf52840/nrf52840/uf2 "$GITHUB_WORKSPACE/firmware"
          -- -DBOARD_ROOT="$GITHUB_WORKSPACE" -DZEPHYR_SDK_INSTALL_DIR="$ZEPHYR_SDK_DIR"

      - name: Build supermini_nrf52840/nrf52840
        working-directory: /ncs
        run: >-
          west build -p always -d "$GITHUB_WORKSPACE/build/plain"
          -b supermini_nrf52840/nrf52840 "$GITHUB_WORKSPACE/firmware"
          -- -DBOARD_ROOT="$GITHUB_WORKSPACE" -DZEPHYR_SDK_INSTALL_DIR="$ZEPHYR_SDK_DIR"
