name: PR merge housekeeping

on:
  pull_request:
    types: [closed]
    branches: [dev, main]

jobs:
  housekeeping:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    env:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: .github/scripts

      - name: Close referenced issues
        id: close-issues
        uses: actions/github-script@v7
        with:
          script: |
            const { referencedIssues } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/project.js`);
            const closed = [];
            for (const issue_number of referencedIssues(context.payload.pull_request.body)) {
              try {
                const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number });
                if (issue.pull_request) {
                  console.log(`Skipping #${issue_number} (pull request, not issue)`);
                  continue;
                }
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                console.log(`Closed issue #${issue_number}`);
                closed.push({ number: issue_number, nodeId: issue.node_id });
              } catch (error) {
                core.warning(`Failed to close #${issue_number}: ${error.message}`);
              }
            }
            core.setOutput('closed', JSON.stringify(closed));

      - name: Set end date on project items
        if: steps.close-issues.outputs.closed != '[]' && env.PROJECT_TOKEN != ''
        uses: actions/github-script@v7
        env:
          # "End date" custom field
          END_DATE_FIELD_ID: PVTF_lAHOBh2HNc4BPjfGzg97glk
          CLOSED: ${{ steps.close-issues.outputs.closed }}
        with:
          github-token: ${{ env.PROJECT_TOKEN }}
          script: |
            const { findProjectItem, setFieldValue } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/project.js`);
            const date = context.payload.pull_request.merged_at.slice(0, 10);
            for (const { number, nodeId } of JSON.parse(process.env.CLOSED)) {
              try {
                const item = await findProjectItem(github, nodeId);
                if (!item) {
                  console.log(`#${number} not in project, skipping`);
                  continue;
                }
                await setFieldValue(github, item.id, process.env.END_DATE_FIELD_ID, { date });
                console.log(`Set end date ${date} on #${number}`);
              } catch (error) {
                core.warning(`Failed to set end date on #${number}: ${error.message}`);
              }
            }

      - name: Delete feature branch
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const prefixes = ['feat/', 'fix/', 'refactor/', 'docs/', 'chore/', 'test/', 'hotfix/'];
            if (!prefixes.some((p) => branch.startsWith(p))) {
              console.log(`Skipping deletion: ${branch} (no matching prefix)`);
              return;
            }
            try {
              await github.rest.git.deleteRef({ ...context.repo, ref: `heads/${branch}` });
              console.log(`Deleted branch: ${branch}`);
            } catch (error) {
              core.warning(`Failed to delete ${branch}: ${error.message}`);
            }
